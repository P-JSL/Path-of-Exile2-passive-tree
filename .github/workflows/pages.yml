name: Validate Exile Tree
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-exile-tree-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bundled tree and web application
        run: |
          node --check assets/app.js
          node --check assets/i18n.js
          node --check assets/renderer.js
          node scripts/validate.mjs
          node --test tests/*.test.mjs
